<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Travel Blog{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/cdn.tailwindcss.com/3.4.1"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-gray-900">🗺️ Travel Blog</a>
            <nav class="flex items-center gap-6">
                <a href="/" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">Home</a>
                <a href="/admin/" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">Admin Portal</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-100 py-6 mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center text-sm text-gray-500">
            <p>&copy; {{ now.year if now else 2026 }} Travel Blog. Built entirely serverless.</p>
        </div>
    </footer>

</body>
</html>
